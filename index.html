<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Relógio</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      overflow: hidden; /* evita scroll; tudo tem de caber */
    }

    /* Área disponível */
    #stage {
      width: calc(100vw - 32px);
      height: calc(100vh - 32px);
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    /* Conteúdo com tamanho "base" do applet */
    #wrap {
      width: 1354px;   /* use o valor que mediu (style width do canvas) */
      height: 561px;   /* use o valor que mediu (style height do canvas) */
      transform-origin: top left;
    }

    iframe {
      width: 1354px;
      height: 561px;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>
  <div id="stage">
    <div id="wrap">
      <iframe
        id="ggb"
        src="https://www.geogebra.org/material/iframe/id/skh54tfp?embed=true&showMenuBar=false&showToolBar=false&showAlgebraInput=false&showResetIcon=false">
      </iframe>
    </div>
  </div>

  <script>
    const BASE_W = 1354;
    const BASE_H = 561;

    function fit() {
      const stage = document.getElementById("stage");
      const wrap = document.getElementById("wrap");

      const availW = stage.clientWidth;
      const availH = stage.clientHeight;

      const scale = Math.min(availW / BASE_W, availH / BASE_H, 1);

      wrap.style.transform = `scale(${scale})`;
    }

    window.addEventListener("resize", fit);
    window.addEventListener("load", fit);
  </script>
</body>
</html>
