<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>GeoGebra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <iframe
        src="https://www.geogebra.org/material/iframe/id/skh54tfp
        ?embed=true
        &showMenuBar=false
        &showToolBar=false
        &showAlgebraInput=false
        &showResetIcon=false"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
