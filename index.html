<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Teste/Exame</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        
        h1 {
            margin: 0;
            padding: 15px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 24px;
            background-color: #f5f5f5;
            border-bottom: 2px solid #4CAF50;
            height: 60px;
            box-sizing: border-box;
            color: #333;
        }
        
        .applet-container {
            width: 100%;
            height: calc(100vh - 60px);
            background: white;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Relógio Teste/Exame</h1>
    <div class="applet-container">
        <!-- URL para incorporação limpa do applet GeoGebra -->
        <iframe 
            src="https://www.geogebra.org/material/iframe/id/d6sthte6"
            frameborder="0"
            scrolling="no"
            allowfullscreen
            allow="autoplay; fullscreen"
            title="Relógio Teste - GeoGebra Applet">
        </iframe>
    </div>
    
    <script>
        // Redirecionar se a URL padrão não funcionar
        document.addEventListener('DOMContentLoaded', function() {
            const iframe = document.querySelector('iframe');
            
            // Monitorar se o iframe falha ao carregar
            iframe.addEventListener('load', function() {
                // Verificar se o conteúdo carregado é o applet ou página de erro
                try {
                    // Esta verificação é limitada por políticas de mesma origem
                    console.log('Applet GeoGebra carregado');
                } catch(e) {
                    console.log('Applet carregado, mas acesso ao conteúdo restrito');
                }
            });
            
            iframe.addEventListener('error', function() {
                console.log('Erro ao carregar, tentando URL alternativa...');
                // Tentar URL alternativa
                iframe.src = "https://www.geogebra.org/classic/embed?id=d6sthte6";
            });
        });
    </script>
</body>
</html>
