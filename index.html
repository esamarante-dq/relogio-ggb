<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Applet GeoGebra</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<iframe 
    src="https://www.geogebra.org/material/iframe/id/skh54tfp
        ?embed=true
        &showMenuBar=false
        &showToolBar=false
        &showAlgebraInput=false
        &showResetIcon=false
        &enableLabelDrags=false
        &enableShiftDragZoom=false
        &enableRightClick=false"
    allowfullscreen>
</iframe>

</body>
</html>
