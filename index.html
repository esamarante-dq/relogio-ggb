<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Teste/Exame</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .header {
            height: 50px;
            line-height: 50px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        
        .container {
            height: calc(100vh - 50px);
            width: 100%;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">Relógio Teste/Exame</div>
    <div class="container">
        <!-- URL correta para incorporação do GeoGebra -->
        <iframe 
            src="https://www.geogebra.org/classic?id=d6sthte6"
            allowfullscreen
            allow="autoplay; fullscreen"
            title="Relógio Teste - GeoGebra Applet">
        </iframe>
    </div>
    
    <script>
        // Script para garantir que o iframe carregue corretamente
        document.addEventListener('DOMContentLoaded', function() {
            const iframe = document.querySelector('iframe');
            
            // Adicionar tratamento de erro
            iframe.addEventListener('error', function() {
                console.error('Erro ao carregar o applet GeoGebra');
                
                // Tentar URL alternativa em caso de erro
                setTimeout(function() {
                    iframe.src = "https://www.geogebra.org/material/iframe/id/d6sthte6";
                }, 2000);
            });
            
            // Confirmar quando carregar
            iframe.addEventListener('load', function() {
                console.log('Applet GeoGebra carregado com sucesso!');
            });
        });
    </script>
</body>
</html>
