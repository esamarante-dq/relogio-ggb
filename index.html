<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Teste | Exame - GeoGebra Applet</title>
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            overflow: hidden; /* Previne scroll na página inteira */
        }
        h1 {
            color: #333;
            margin: 10px 0;
            text-align: center;
            flex-shrink: 0; /* Não encolhe */
        }
        #ggb-container {
    width: 100%;
    max-width: 1200px;
    height: calc(100vw * 0.5625); /* 16:9 ratio */
    max-height: 675px; /* 1200 * 0.5625 */
        }
        .info {
            margin: 10px 0;
            text-align: center;
            color: #666;
            font-size: 0.9em;
            max-width: 800px;
            flex-shrink: 0; /* Não encolhe */
        }
        .author {
            font-style: italic;
            margin-top: 5px;
        }
        @media (max-width: 768px) {
            #ggb-container {
                width: 98vw;
                height: calc(98vh - 100px);
            }
        }
    </style>
</head>
<body>
    <h1>Relógio Teste | Exame</h1>
    
    <div id="ggb-container"></div>
    
    <div class="info">
        <!-- <p>Applet GeoGebra incorporado da página: <a href="https://www.geogebra.org/m/d6sthte6" target="_blank">https://www.geogebra.org/m/d6sthte6</a></p> -->
        <p class="author">DQ | Escola Secundária Amarante</p>
    </div>

    <script>
        var params = {
            "appName": "classic",
            "width": "100%",
            "height": "100%",
            "showToolBar": false,
            "showAlgebraInput": false,
            "showMenuBar": false,
            "showToolBarHelp": false,
            "showResetIcon": false,
            "showFullscreenButton": true,
            "enableLabelDrags": true,
            "enableShiftDragZoom": false,
            "enableRightClick": true,
            "errorDialogsActive": false,
            "useBrowserForJS": false,
            "allowStyleBar": false,
            "showKeyboard": false,
            "allowUpscale": false,
            "scale": 1.0, /* Força escala 1:1 */
            "material_id": "d6sthte6",
            "borderColor": "transparent",
            "autoHeight": false /* Importante: não ajusta altura automaticamente */
        };
        
        var ggbApp = new GGBApplet(params, true);
        
        window.addEventListener("load", function() {
            ggbApp.inject("ggb-container");
            
            // Remove a prevenção de roda do rato que estava a causar problemas
            // O zoom já está desativado via allowUpscale: false
        });
        
        // Adicional: redimensiona o applet quando a janela muda de tamanho
        window.addEventListener("resize", function() {
            if (window.ggbApplet) {
                window.ggbApplet.recalculate();
            }
        });
    </script>
</body>
</html>
