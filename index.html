<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Teste/Exame</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: white;
        }
        
        h1 {
            margin: 0;
            padding: 12px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 20px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
            height: 48px;
            box-sizing: border-box;
        }
        
        .geogebra-container {
            width: 100%;
            height: calc(100vh - 48px); /* 100% da viewport menos a altura do título */
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Relógio Teste/Exame</h1>
    <div class="geogebra-container">
        <iframe 
            src="https://www.geogebra.org/material/iframe/id/d6sthte6/width/100%/height/100%/border/888888/sfsb/true/smb/false/stb/false/stbh/false/ai/false/asb/false/sri/false/rc/false/ld/false/sdz/false/ctl/false"
            frameborder="0"
            scrolling="no"
            allowfullscreen
            allow="autoplay; fullscreen *">
        </iframe>
    </div>
</body>
</html>
